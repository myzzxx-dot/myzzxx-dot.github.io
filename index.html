<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥이네 붕어빵</title>
<meta name="description" content="고양이 손님이 줄 서는 겨울밤 붕어빵 가게! 방치형 힐링 타이쿤 게임">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#4A2C17; --ink2:#8A6446; --line:#F0DDBF; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;line-height:1.7;
       background:radial-gradient(circle at 50% 0%, #7A56B0 0%, #4A3478 45%, #241D47 100%) fixed}
  main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
  .hero{text-align:center;color:#FFF3D6}
  .icon{width:120px;height:120px;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:4px solid #FFF3D6}
  h1{font-family:'Jua',sans-serif;font-weight:400;font-size:36px;margin:14px 0 2px}
  .tag{color:#FFD98A;font-size:16px;margin:0}
  .banner{width:100%;border-radius:20px;margin:22px 0 4px;border:3px solid #FFF3D6;display:block}
  .card{background:#FFF6E6;border-radius:22px;padding:18px 20px;margin-top:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .card h2{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;margin:0 0 6px}
  .card ul{margin:0;padding-left:20px}
  .soon{display:block;text-align:center;font-family:'Jua',sans-serif;font-size:18px;background:#FF8A5B;color:#fff;
        border-radius:999px;padding:12px;margin-top:18px;text-decoration:none}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .links a{flex:1;min-width:150px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;
           padding:10px;color:var(--ink);text-decoration:none;font-family:'Jua',sans-serif}
  footer{text-align:center;color:rgba(255,243,214,.6);font-size:13px;margin-top:22px}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img class="icon" src="icon.png" alt="냥이네 붕어빵 아이콘">
    <h1>냥이네 붕어빵</h1>
    <p class="tag">고양이 손님이 줄 서는 겨울밤 붕어빵 가게 🐟</p>
  </div>
  <img class="banner" src="banner.png" alt="냥이네 붕어빵 대표 이미지">
  <span class="soon">📱 Google Play에서 곧 만나요!</span>

  <div class="card">
    <h2>🐱 어떤 게임인가요?</h2>
    <ul>
      <li>붕어빵을 굽고 고양이 손님에게 팔아 가게를 키우는 방치형 게임</li>
      <li>앱을 꺼 둬도 가게는 계속 돌아가요</li>
      <li>옷·장식 꾸미기, 무지개 등급 아이템, 고양이 도감 18종</li>
      <li>서울에서 우주까지, 10개 도시에 지점 열기</li>
    </ul>
  </div>

  <div class="card">
    <h2>📮 안내</h2>
    <div class="links">
      <a href="privacy.html">📜 개인정보처리방침</a>
      <a href="mailto:myzzxx@gmail.com">✉️ 문의하기</a>
    </div>
  </div>

  <footer>© 2026 Ryan · 냥이네 붕어빵</footer>
</main>
</body>
</html>
